version: 2

models:
  - name: int_telesales__monthly_funnel
    description: Funnel aggregated to month x campaign x pool x agent type.
    columns:
      - name: call_month
        data_tests: [not_null]
      - name: dials
        data_tests: [not_null]

  - name: int_telesales__pool_monthly
    description: Monthly connect-rate series per caller-ID pool with the previous month's rate for MoM comparisons.
    columns:
      - name: caller_id_pool
        data_tests: [not_null]
      - name: connect_rate
        data_tests: [not_null]
